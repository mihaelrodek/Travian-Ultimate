name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Java 21 + Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Travian Bot/backend"
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Build + test
        run: mvn -B -ntp verify

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Travian Bot/frontend"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "Travian Bot/frontend/package-lock.json"
      - name: Install
        run: npm ci
      - name: Type-check + build
        run: npm run build
