services:
  postgres:
    image: postgres:16-alpine
    container_name: travian-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travian_bot}
      POSTGRES_USER: ${POSTGRES_USER:-travian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travian}
    ports:
      - "5485:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
